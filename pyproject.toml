[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modapts-time-study"
version = "0.1.0"
description = "Stopwatch time studies, MODAPTS predetermined times, takt analysis, and observed-vs-predicted comparison for manufacturing engineers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fitsum Taye Feyissa" }]
keywords = ["MODAPTS", "time study", "takt", "cycle time", "industrial engineering", "lean"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Manufacturing",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
charts = ["matplotlib>=3.7"]
dev = ["pytest>=7"]

[project.scripts]
modapts-time-study = "modapts_time_study.cli:main"

[tool.setuptools.packages.find]
include = ["modapts_time_study*"]
